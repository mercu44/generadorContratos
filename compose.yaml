services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contratos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contratos_local}
      POSTGRES_DB: ${POSTGRES_DB:-contratos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    environment:
      PORT: 3000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-contratos}
      PGPASSWORD: ${POSTGRES_PASSWORD:-contratos_local}
      PGDATABASE: ${POSTGRES_DB:-contratos}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    init: true
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
